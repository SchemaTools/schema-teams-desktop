# Сборка установщика (ТЗ, 9.1): NSIS, в профиль пользователя, без прав администратора.
appId: SchemaTeams.Desktop
productName: Schema Teams
copyright: Schema
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
asar: true
asarUnpack:
  - dist/native/*.exe
# папка установки у установщика «в один щелчок» берётся из name (ТЗ, 9.1: Programs\Schema Teams)
extraMetadata:
  name: Schema Teams
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # подпись (ТЗ, 9.2; решение 05.11): `npm run dist:signed` — сертификатом бюро «Schema Bureau Revit
  # Plugins» из хранилища «Личное» компьютера сборки, как у плагинов; `npm run dist` — без подписи
  signAndEditExecutable: true
nsis:
  # установка в один щелчок: без вопросов и без прав администратора
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Schema Teams
  # журналы и настройки при удалении остаются (ТЗ, 9.1)
  deleteAppDataOnUninstall: false
  artifactName: Schema Teams Setup ${version}.${ext}
  # ярлык «Пуска» пересоздаётся при каждой установке (значок после обновления, решение 06.11)
  include: installer/windows.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish: null
