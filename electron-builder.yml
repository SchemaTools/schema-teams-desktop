# Сборка установщика (ТЗ, 9.1): NSIS, в профиль пользователя, без прав администратора.
appId: SchemaTeams.Desktop
productName: Schema Teams
copyright: Schema
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
asar: true
asarUnpack:
  - dist/native/*.exe
# папка установки у установщика «в один щелчок» берётся из name (ТЗ, 9.1: Programs\Schema Teams)
extraMetadata:
  name: Schema Teams
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # подпись — шаг Д6 (ТЗ, 9.2): сертификат из переменных окружения компьютера сборки
  signAndEditExecutable: true
nsis:
  # установка в один щелчок: без вопросов и без прав администратора
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Schema Teams
  # журналы и настройки при удалении остаются (ТЗ, 9.1)
  deleteAppDataOnUninstall: false
  artifactName: Schema Teams Setup ${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish: null
